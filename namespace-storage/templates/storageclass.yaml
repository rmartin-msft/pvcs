apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.azureFiles.storageClass.name }}
provisioner: file.csi.azure.com
parameters:
  {{- if .Values.azureFiles.storageClass.resourceGroup }}
  resourceGroup: {{ .Values.azureFiles.storageClass.resourceGroup }}
  {{- end }}
  {{- if .Values.azureFiles.storageClass.storageAccount }}
  storageAccount: {{ .Values.azureFiles.storageClass.storageAccount }}
  {{- end }}
  {{- if .Values.azureFiles.storageClass.mountWithWorkloadIdentityToken }}
  mountWithWorkloadIdentityToken: "true"
  {{- end }}
  {{- if .Values.workloadIdentity.clientId }}
  clientID: "{{ .Values.workloadIdentity.clientId }}"
  {{- end }}
reclaimPolicy: {{ .Values.azureFiles.storageClass.reclaimPolicy }}
volumeBindingMode: {{ .Values.azureFiles.storageClass.volumeBindingMode }}
allowVolumeExpansion: {{ .Values.azureFiles.storageClass.allowVolumeExpansion }}
mountOptions:
{{- range .Values.azureFiles.storageClass.mountOptions }}
  - {{ . | quote }}
{{- end }}