{{- if .Values.pvc.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.pvc.name }}
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
  {{- range .Values.pvc.accessModes }}
    - {{ . }}
  {{- end }}
  storageClassName: {{ .Values.azureFiles.storageClass.name }}
  resources:
    requests:
      storage: {{ .Values.pvc.size }}
{{- end }}