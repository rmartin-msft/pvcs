apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPVCPodWorkloadIdentity
metadata:
  name: pvc-pod-workload-identity
spec:
  match:
    kinds:
    - apiGroups: [""]
      kinds: ["Pod"]
    excludedNamespaces:
    - kube-system
    - gatekeeper-system
  parameters:
    requirePodWorkloadIdentityLabel: true
    namespaceClientIds:
      apps-team-1: "00000000-0000-0000-0000-000000000001"
      apps-team-2: "00000000-0000-0000-0000-000000000002"
